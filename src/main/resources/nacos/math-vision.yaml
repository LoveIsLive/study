# Canonical Nacos dataId: math-vision
# Mirrors the active dev catalog. Runtime credentials remain user-owned in MySQL;
# all non-secret model and workflow behavior is controlled by this Nacos document.
workflow:
  visualDesignSceneMaxRetries: 3
  storyboardValidationMaxRetries: 5
  placementEnrichmentMaxRetries: 3
  storyboardCleanupConversationRounds: 8
  placementEnrichmentConversationRounds: 4
  codeGenerationMaxRetries: 2
  codeGenerationRetryDelayMillis: 2000
  codeEvaluationMaxRetries: 3
  codeFixConversationRounds: 4
  renderQuality: low
  renderMaxRetries: 10
  sceneEvaluationMaxRetries: 5
  renderFixConversationRounds: 10
  aiTraceEnabled: false
  aiTraceMaxChars: 200000

modelDefaults:
  reasoningContentFallback: false
  temperature: 0.6
  requestTimeoutSeconds: 300
  timeoutRetryAttempts: 1
  timeoutRetryMultiplier: 2.0
  maxRequestTimeoutSeconds: 900
  emptyResponseRetries: 2
  transientFailureRetries: 2
  transientRetryBaseDelayMillis: 1000
  transientRetryMaxDelayMillis: 4000
  rateLimitRetries: 12
  rateLimitBaseDelayMillis: 5000
  rateLimitMaxDelayMillis: 300000
  rateLimitJitterRatio: 0.25

model-providers:
  # ----------------------------- OpenAI -----------------------------
  - code: openai
    name: OpenAI
    baseUrl: https://api.openai.com/v1
    enabled: true
    temperature: 0.6
    models:
      - modelName: gpt-5.5
        displayName: GPT-5.5
        supportVision: true
        supportJsonOutput: true
        supportThinking: true
        contextWindow: 1050000
        maxOutputTokens: 128000
      - modelName: gpt-5.5-pro
        displayName: GPT-5.5 Pro
        supportVision: true
        supportJsonOutput: true
        supportThinking: true
