<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学系统登录</title>
    <link rel="stylesheet" href="/static/auth/login.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="/static/lib/css/font-awesome-all.min.css">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <form id="login-form">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="用户名" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="密码" required>
                <i class="fas fa-eye-slash" id="togglePassword"></i>
            </div>
            <button type="submit" class="login-button">登 录</button>
        </form>
    </div>
</div>

<!-- Scripts -->
<!-- SweetAlert2 for beautiful alerts -->
<script src="/static/lib/js/sweetalert2.all.min.js"></script>
<!-- Axios for simplified HTTP requests -->
<script src="/static/lib/js/axios.min.js"></script>
<!-- Custom JS -->
<script src="/static/common/js/common_config.js"></script>
<script src="/static/common/js/axios_create.js"></script>
<script src="/static/auth/login.js"></script>

</body>
</html>
