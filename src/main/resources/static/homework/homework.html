<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业区</title>
    <!-- 认证守卫 -->
    <script src="/static/common/js/auth_guard.js"></script>

    <!-- 外部库 -->
    <link rel="stylesheet" href="/static/lib/css/font-awesome-all.min.css">

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/common/css/common_header.css">
    <link rel="stylesheet" href="/static/homework/homework.css">
</head>
<body>

<!-- ================= 公共导航栏 开始 ================= -->
<header class="main-header">
    <div class="header-container">
        <!-- 左侧：Logo 和 导航 -->
        <div class="header-left">
            <div class="header-logo">
                <a href="/">教学系统</a>
            </div>
            <nav class="header-nav">
                <ul>
                    <li><a href="/ware/home">课程仓库</a></li>
                    <li><a href="/homework">作业区</a></li>
                    <!-- 未来可以添加更多页面 -->
                    <!-- <li><a href="/grades.html">成绩查询</a></li> -->
                </ul>
            </nav>
        </div>

        <!-- 右侧：用户信息 -->
        <div class="header-right">
            <div class="user-profile-container">
                <div class="user-profile" id="user-profile-trigger">
                    <img src="https://placehold.co/40x40" alt="User Avatar" id="user-avatar">
                    <span id="user-name">未登录</span>
                </div>
                <!-- 用户信息下拉菜单 -->
                <div class="user-dropdown" id="user-dropdown-menu">
                    <div class="dropdown-header">
                        <img src="https://placehold.co/60x60" alt="User Avatar" id="dropdown-user-avatar">
                        <div class="user-info">
                            <p class="user-name-large" id="dropdown-user-name">未登录</p>
                            <p class="user-role" id="dropdown-user-role">--</p>
                        </div>
                    </div>
                    <div class="dropdown-footer">
                        <button id="logout-btn"><i class="fas fa-sign-out-alt"></i> 退出登录</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<!-- ================= 公共导航栏 结束 ================= -->

<div id="homework-app" class="app-container">
    <!-- 页面主标题 -->
    <header class="app-header">
        <h1 id="main-title">作业区</h1>
        <div id="header-actions"></div>
    </header>

    <!-- 加载动画 -->
    <div id="loading-spinner" class="spinner-container" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- 主内容区 -->
    <main id="app-main-content">

        <!-- 视图: 作业列表 (教师和学生共用) -->
        <div id="view-homework-list" class="view" style="display: none;">
            <!-- 学生视图下的Tab切换 -->
            <div id="student-tabs" class="tabs-container" style="display: none;">
                <button class="tab-btn active" data-tab="all-homework">所有作业</button>
                <button class="tab-btn" data-tab="my-submissions">我的提交</button>
            </div>
            <div id="homework-list-container" class="list-container">
                <!-- 作业项将动态插入此处 -->
            </div>
            <div id="my-submission-list-container" class="list-container" style="display: none;">
                <!-- 我的提交列表将动态插入此处 -->
            </div>
        </div>

        <!-- 视图: 教师查看指定作业的所有提交 -->
        <div id="view-submission-list" class="view" style="display: none;">
            <div class="view-header">
                <button id="back-to-homework-list-btn" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> 返回作业列表</button>
                <h2 id="submission-list-title"></h2>
            </div>
            <div id="submission-list-container" class="list-container">
                <!-- 提交项将动态插入此处 -->
            </div>
        </div>

        <!-- 视图: 学生查看/提交单个作业 -->
        <div id="view-student-submission-detail" class="view" style="display: none;">
            <div class="view-header">
                <button id="back-to-student-homework-list-btn" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> 返回作业列表</button>
                <h2 id="student-submission-homework-title"></h2>
            </div>
            <div id="submission-detail-container">
                <!-- 将显示已有提交或提交表单 -->
            </div>
        </div>


        <!-- 模态框: 发布/编辑作业 -->
        <div id="publish-homework-modal" class="modal">
            <div class="modal-content large">
                <span class="close-btn">&times;</span>
                <h2>发布新作业</h2>
                <form id="publish-homework-form">
                    <div class="form-group">
                        <label for="homework-title">作业标题</label>
                        <input type="text" id="homework-title" required placeholder="请输入作业标题">
                    </div>
                    <div class="form-group">
                        <label for="homework-content">作业内容</label>
                        <textarea id="homework-content" rows="6" placeholder="请输入详细作业要求..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>附件上传</label>
                        <div id="publish-drag-drop-area" class="drag-drop-area">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>将文件拖拽到此处，或点击选择文件</p>
                            <input type="file" id="publish-file-input" multiple hidden>
                        </div>
                        <div id="publish-file-list" class="file-list-preview"></div>
                    </div>
                    <div id="publish-upload-progress-container" class="upload-progress-container" style="display: none;">
                        <!-- 进度条将动态添加 -->
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> 立即发布</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>


<!-- 外部库JS -->
<script src="/static/lib/js/axios.min.js"></script>
<script src="/static/lib/js/sweetalert2.all.min.js"></script>
<script src="/static/lib/js/jwt-decode.min.js"></script>

<!-- 通用工具JS -->
<script src="/static/common/js/common_config.js"></script>
<script src="/static/common/js/common_utils.js"></script>
<script src="/static/common/js/axios_create.js"></script>

<!-- 模块JS -->
<script src="/static/common/js/common-header.js"></script>
<script src="/static/homework/homework.js"></script>

</body>
</html>
