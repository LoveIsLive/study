<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业区 - 教学系统</title>
    <!-- 认证守卫 -->
    <script src="/static/common/js/auth_guard.js"></script>

    <!-- 样式文件 -->
    <link rel="stylesheet" href="/static/homework/homework.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="/static/lib/css/font-awesome-all.min.css">
</head>
<body>
<div class="homework-container">
    <!-- 头部导航 -->
    <header class="homework-header">
        <div class="header-left">
            <h1><i class="fas fa-clipboard-list"></i> 作业区</h1>
        </div>
        <div class="header-right">
            <div class="user-info">
                <span id="user-role-badge" class="role-badge"></span>
                <span id="user-name"></span>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="homework-main">
        <!-- 教师视图 -->
        <div id="teacher-view" class="view-container" style="display: none;">
            <div class="action-bar">
                <button id="publish-homework-btn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> 发布作业
                </button>
                <div class="view-toggle">
                    <button id="my-homeworks-tab" class="tab-btn active">我发布的作业</button>
                    <button id="all-submissions-tab" class="tab-btn">所有提交</button>
                </div>
            </div>

            <!-- 我发布的作业列表 -->
            <div id="my-homeworks-section" class="content-section">
                <div class="homework-grid" id="teacher-homework-list">
                    <!-- 作业卡片将在这里动态生成 -->
                </div>
            </div>

            <!-- 所有提交列表 -->
            <div id="all-submissions-section" class="content-section" style="display: none;">
                <div class="submissions-list" id="all-submissions-list">
                    <!-- 提交列表将在这里动态生成 -->
                </div>
            </div>
        </div>

        <!-- 学生视图 -->
        <div id="student-view" class="view-container" style="display: none;">
            <div class="action-bar">
                <div class="view-toggle">
                    <button id="all-homeworks-tab" class="tab-btn active">所有作业</button>
                    <button id="my-submissions-tab" class="tab-btn">我的提交</button>
                </div>
                <div class="filter-controls">
                    <select id="status-filter">
                        <option value="all">全部状态</option>
                        <option value="submitted">已提交</option>
                        <option value="not-submitted">未提交</option>
                    </select>
                </div>
            </div>

            <!-- 所有作业列表 -->
            <div id="all-homeworks-section" class="content-section">
                <div class="homework-grid" id="student-homework-list">
                    <!-- 作业卡片将在这里动态生成 -->
                </div>
            </div>

            <!-- 我的提交列表 -->
            <div id="my-submissions-section" class="content-section" style="display: none;">
                <div class="submissions-list" id="student-submissions-list">
                    <!-- 提交列表将在这里动态生成 -->
                </div>
            </div>
        </div>

        <!-- 加载动画 -->
        <div id="loading-spinner" class="spinner-container" style="display: none;">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>

        <!-- 空状态 -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <i class="fas fa-clipboard-list empty-icon"></i>
            <h3>暂无内容</h3>
            <p id="empty-message">这里还没有任何作业</p>
        </div>
    </main>
</div>

<!-- 发布作业模态框 -->
<div id="publish-homework-modal" class="modal">
    <div class="modal-content large-modal">
        <div class="modal-header">
            <h2><i class="fas fa-plus-circle"></i> 发布作业</h2>
            <span class="close-btn">&times;</span>
        </div>
        <form id="publish-homework-form" class="modal-body">
            <div class="form-group">
                <label for="homework-title">作业标题 *</label>
                <input type="text" id="homework-title" name="title" required maxlength="255"
                       placeholder="请输入作业标题">
            </div>

            <div class="form-group">
                <label for="homework-content">作业内容</label>
                <textarea id="homework-content" name="content" rows="6"
                          placeholder="请输入作业要求和说明..."></textarea>
            </div>

            <div class="form-group">
                <label>附件</label>
                <div class="file-upload-area">
                    <div id="small-files-area" class="upload-section">
                        <h4><i class="fas fa-paperclip"></i> 小文件 (直接上传)</h4>
                        <div id="small-file-drop-zone" class="drop-zone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>拖拽文件到此处或点击选择</p>
                            <input type="file" id="small-file-input" multiple hidden>
                        </div>
                        <div id="small-files-list" class="files-list"></div>
                    </div>

                    <div id="large-files-area" class="upload-section">
                        <h4><i class="fas fa-file-upload"></i> 大文件 (分块上传)</h4>
                        <div id="large-file-drop-zone" class="drop-zone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>拖拽大文件到此处或点击选择</p>
                            <input type="file" id="large-file-input" multiple hidden>
                        </div>
                        <div id="large-files-list" class="files-list"></div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancel-publish-btn">取消</button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> 发布作业
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 作业详情模态框 -->
<div id="homework-detail-modal" class="modal">
    <div class="modal-content large-modal">
        <div class="modal-header">
            <h2 id="homework-detail-title"></h2>
            <span class="close-btn">&times;</span>
        </div>
        <div class="modal-body">
            <div id="homework-detail-content"></div>
        </div>
    </div>
</div>

<!-- 提交作业模态框 -->
<div id="submit-homework-modal" class="modal">
    <div class="modal-content large-modal">
        <div class="modal-header">
            <h2><i class="fas fa-upload"></i> 提交作业</h2>
            <span class="close-btn">&times;</span>
        </div>
        <form id="submit-homework-form" class="modal-body">
            <input type="hidden" id="submit-homework-id">

            <div class="homework-info">
                <h3 id="submit-homework-title"></h3>
                <div id="submit-homework-content"></div>
            </div>

            <div class="form-group">
                <label for="submission-content">提交内容</label>
                <textarea id="submission-content" name="content" rows="6"
                          placeholder="请输入您的作业内容或说明..."></textarea>
            </div>

            <div class="form-group">
                <label>附件</label>
                <div class="file-upload-area">
                    <div id="submission-small-files-area" class="upload-section">
                        <h4><i class="fas fa-paperclip"></i> 小文件 (直接上传)</h4>
                        <div id="submission-small-file-drop-zone" class="drop-zone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>拖拽文件到此处或点击选择</p>
                            <input type="file" id="submission-small-file-input" multiple hidden>
                        </div>
                        <div id="submission-small-files-list" class="files-list"></div>
                    </div>

                    <div id="submission-large-files-area" class="upload-section">
                        <h4><i class="fas fa-file-upload"></i> 大文件 (分块上传)</h4>
                        <div id="submission-large-file-drop-zone" class="drop-zone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>拖拽大文件到此处或点击选择</p>
                            <input type="file" id="submission-large-file-input" multiple hidden>
                        </div>
                        <div id="submission-large-files-list" class="files-list"></div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancel-submit-btn">取消</button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> 提交作业
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 查看提交详情模态框 -->
<div id="submission-detail-modal" class="modal">
    <div class="modal-content large-modal">
        <div class="modal-header">
            <h2><i class="fas fa-eye"></i> 提交详情</h2>
            <span class="close-btn">&times;</span>
        </div>
        <div class="modal-body">
            <div id="submission-detail-content"></div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="/static/lib/js/sweetalert2.all.min.js"></script>
<script src="/static/lib/js/axios.min.js"></script>
<script src="/static/common/js/common_utils.js"></script>
<script src="/static/common/js/axios_create.js"></script>
<script src="/static/homework/homework.js"></script>
</body>
</html>
