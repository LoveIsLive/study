<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学系统</title>
    <!-- 认证守卫 -->
    <script src="/static/common/js/auth_guard.js"></script>

    <!-- 外部库 -->
    <link rel="stylesheet" href="/static/lib/css/font-awesome-all.min.css">
    <!-- AOS Animate On Scroll Library CSS -->
    <link rel="stylesheet" href="/static/lib/css/aos.css" />
    <!-- Google Fonts for a futuristic feel -->
    <link rel="stylesheet" href="/static/lib/css/googleapis.css">

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/common/css/common_header.css">
    <link rel="stylesheet" href="/static/index/index.css">
</head>
<body>

<!-- ================= 公共导航栏 开始 ================= -->
<header class="main-header">
    <div class="header-container">
        <!-- 左侧：Logo 和 导航 -->
        <div class="header-left">
            <div class="header-logo">
                <a href="/">教学系统</a>
            </div>
            <nav class="header-nav">
                <ul>
                    <li><a href="/ware/home">课程仓库</a></li>
                    <li><a href="/homework">作业区</a></li>
                    <!-- 未来可以添加更多页面 -->
                    <!-- <li><a href="/grades.html">成绩查询</a></li> -->
                </ul>
            </nav>
        </div>

        <!-- 右侧：用户信息 -->
        <div class="header-right">
            <div class="user-profile-container">
                <div class="user-profile" id="user-profile-trigger">
                    <img src="https://placehold.co/40x40" alt="User Avatar" id="user-avatar">
                    <span id="user-name">未登录</span>
                </div>
                <!-- 用户信息下拉菜单 -->
                <div class="user-dropdown" id="user-dropdown-menu">
                    <div class="dropdown-header">
                        <img src="https://placehold.co/60x60" alt="User Avatar" id="dropdown-user-avatar">
                        <div class="user-info">
                            <p class="user-name-large" id="dropdown-user-name">未登录</p>
                            <p class="user-role" id="dropdown-user-role">--</p>
                        </div>
                    </div>
                    <div class="dropdown-footer">
                        <button id="logout-btn"><i class="fas fa-sign-out-alt"></i> 退出登录</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<!-- ================= 公共导航栏 结束 ================= -->


<!-- ================= 动态星空背景 开始 ================= -->
<div id="particles-js"></div>
<!-- ================= 动态星空背景 结束 ================= -->


<!-- ================= 炫酷时间线 开始 ================= -->
<div class="timeline-container">
    <div class="timeline-path">
        <svg width="100%" height="100%" viewBox="0 0 1000 4000" preserveAspectRatio="none">
            <path d="M 500 0
                         C 500 200, 200 300, 500 500
                         S 800 700, 500 1000
                         S 200 1300, 500 1500
                         S 800 1700, 500 2000
                         S 200 2300, 500 2500
                         S 800 2700, 500 3000
                         S 200 3300, 500 3500
                         S 800 3700, 500 4000" fill="none" stroke-width="4" />
        </svg>
    </div>
    <div class="timeline-content">
        <!-- 课时项将由JS动态生成 -->
    </div>
</div>
<!-- ================= 炫酷时间线 结束 ================= -->


<!-- 外部库JS -->
<script src="/static/lib/js/axios.min.js"></script>
<script src="/static/lib/js/sweetalert2.all.min.js"></script>
<script src="/static/lib/js/jwt-decode.min.js"></script>
<!-- GSAP 动画库 -->
<script src="/static/lib/js/gsap.min.js"></script>
<script src="/static/lib/js/ScrollTrigger.min.js"></script>
<!-- particles.js 星空背景 -->
<script src="/static/lib/js/particles.min.js"></script>

<!-- 通用工具JS -->
<script src="/static/common/js/common_config.js"></script>
<script src="/static/common/js/common_utils.js"></script>
<script src="/static/common/js/axios_create.js"></script>

<!-- 模块JS -->
<script src="/static/common/js/common-header.js"></script>
<script src="/static/index/index.js"></script>

</body>
</html>
