<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwang's File System</title>
    <!--   认证守卫 -->
    <script src="/static/common/js/auth_guard.js"></script>

    <link rel="stylesheet" href="/static/common/css/common_header.css">
    <link rel="stylesheet" href="/static/ware/ware.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="/static/lib/css/font-awesome-all.min.css">
</head>
<body>

<!-- ================= 公共导航栏 开始 ================= -->
<header class="main-header">
    <div class="header-container">
        <!-- 左侧：Logo 和 导航 -->
        <div class="header-left">
            <div class="header-logo">
                <a href="/">教学系统</a>
            </div>
            <nav class="header-nav">
                <ul>
                    <li><a href="/ware/home">课程仓库</a></li>
                    <li><a href="/homework">作业区</a></li>
                    <!-- 未来可以添加更多页面 -->
                    <!-- <li><a href="/grades.html">成绩查询</a></li> -->
                </ul>
            </nav>
        </div>

        <!-- 右侧：用户信息 -->
        <div class="header-right">
            <div class="user-profile-container">
                <div class="user-profile" id="user-profile-trigger">
                    <img src="https://placehold.co/40x40" alt="User Avatar" id="user-avatar">
                    <span id="user-name">未登录</span>
                </div>
                <!-- 用户信息下拉菜单 -->
                <div class="user-dropdown" id="user-dropdown-menu">
                    <div class="dropdown-header">
                        <img src="https://placehold.co/60x60" alt="User Avatar" id="dropdown-user-avatar">
                        <div class="user-info">
                            <p class="user-name-large" id="dropdown-user-name">未登录</p>
                            <p class="user-role" id="dropdown-user-role">--</p>
                        </div>
                    </div>
                    <div class="dropdown-footer">
                        <button id="logout-btn"><i class="fas fa-sign-out-alt"></i> 退出登录</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<!-- ================= 公共导航栏 结束 ================= -->

<div class="file-manager">
    <header class="file-manager-header">
        <div class="header-left" id="new-div">

        </div>
        <div class="header-center">
            <div class="path-container">
                <i class="fas fa-terminal"></i>
                <input type="text" id="path-input" placeholder="输入路径，按Enter跳转. e.g. /dir1/subdir or ../">
            </div>
        </div>
        <div class="header-right">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="实时搜索文件...">
            </div>
        </div>
    </header>

    <div class="breadcrumb" id="breadcrumb">
        <!-- Breadcrumb links will be inserted here by JS -->
    </div>

    <main class="file-manager-main">
        <table class="file-table">
            <thead>
            <tr>
                <th class="col-icon"></th>
                <th class="col-name">名称</th>
                <th class="col-size">大小</th>
                <th class="col-modified">修改日期</th>
                <th class="col-actions">操作</th>
            </tr>
            </thead>
            <tbody id="file-list">
            <!-- File and directory rows will be inserted here -->
            </tbody>
        </table>
        <div id="loading-spinner" class="spinner-container" style="display: none;">
            <div class="spinner"></div>
        </div>
    </main>
</div>

<!-- Modal for New Directory/File -->
<div id="new-item-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn">×</span>
        <h2>新建</h2>
        <div id="new-item-options">
            <button id="show-new-dir-form" class="btn"><i class="fas fa-folder-plus"></i> 新建目录</button>
            <button id="show-upload-file-form" class="btn"><i class="fas fa-file-upload"></i> 上传文件</button>
        </div>
        <!-- New Directory Form -->
        <form id="new-dir-form" style="display: none;">
            <h3>新建目录</h3>
            <input type="text" id="new-dir-name" placeholder="目录名称" required>
            <button type="submit" class="btn btn-primary">创建</button>
        </form>
        <!-- Upload File Form -->
        <form id="upload-file-form" style="display: none;">
            <div class="form-group">
                <div id="ware-drag-drop-area" class="drag-drop-area">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>将文件拖拽到此处，或点击选择文件</p>
                    <input type="file" id="ware-file-input" multiple hidden>
                </div>
                <div id="ware-file-list" class="file-list-preview"></div>
            </div>
            <div id="ware-upload-progress-container" class="upload-progress-container" style="display: none;">
                <!-- 进度条将动态添加 -->
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> 立即上传</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal for Search Results -->
<div id="search-results-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn">×</span>
        <h2>搜索结果</h2>
        <div id="search-results-list">
            <!-- Search results will be appended here -->
        </div>
        <p id="search-status-message"></p>
    </div>
</div>

<!-- Scripts -->
<!-- SweetAlert2 for beautiful alerts -->
<script src="/static/lib/js/sweetalert2.all.min.js"></script>
<!-- Axios for simplified HTTP requests -->
<script src="/static/lib/js/axios.min.js"></script>
<!-- SockJS and Stomp.js for WebSocket communication -->
<script src="/static/lib/js/sockjs.min.js"></script>
<script src="/static/lib/js/stomp.min.js"></script>
<script src="/static/lib/js/jwt-decode.min.js"></script>
<!-- Custom JS -->
<script src="/static/common/js/common_config.js"></script>
<script src="/static/common/js/common_utils.js"></script>
<script src="/static/common/js/axios_create.js"></script>
<script src="/static/common/js/common-header.js"></script>
<script src="/static/ware/ware.js"></script>

</body>
</html>
