<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Icon Example</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .terminal-item {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .terminal-icon {
            color: #00ff00;
            margin-right: 10px;
        }
    </style>
</head>
<body>
<h1><i class="fas fa-terminal terminal-icon"></i> 命令行工具</h1>

<div class="terminal-item">
    <i class="fas fa-terminal fa-lg"></i>
    <span>终端命令示例</span>
</div>

<div class="terminal-item">
    <i class="fas fa-terminal fa-2x" style="color: #0066cc;"></i>
    <span>蓝色终端图标</span>
</div>

<div class="terminal-item">
    <i class="fas fa-terminal fa-spin" style="color: #ff6600;"></i>
    <span>旋转的终端图标</span>
</div>
</body>
</html>
